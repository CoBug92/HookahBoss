xcassets:
- inputs: ../HookahBoss/Resources/Assets/Images.xcassets
  outputs:
    output: ../HookahBoss/Resources/Generated/Images.swift
    templateName: swift5
    params:
      enumName: Images
      publicAccess: 1
      noAllValues: 1
- inputs: ../HookahBoss/Resources/Assets/Colors.xcassets
  outputs:
    templateName: swift5
    output: ../HookahBoss/Resources/Generated/Colors.swift
    params:
      enumName: Colors
      publicAccess: 1
      noAllValues: 1

strings:
- inputs: ../HookahBoss/Resources/Localizable/ru.lproj/Localizable.strings
  outputs:
    templateName: structured-swift5
    output: ../HookahBoss/Resources/Generated/Localizations.swift
    params:
      enumName: Localizations
      publicAccess: 1
      noComments: 0
