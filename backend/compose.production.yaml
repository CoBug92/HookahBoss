services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hookahboss
      POSTGRES_USER: hookahboss
      POSTGRES_PASSWORD: ${HOOKAHBOSS_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookahboss -d hookahboss"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: hookahboss-api:production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://hookahboss:${HOOKAHBOSS_POSTGRES_PASSWORD}@postgres:5432/hookahboss
      NODE_ENV: production
      APPLE_PROVIDER_MODE: enabled
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_PROVIDER_CLIENT_ID: ${APPLE_PROVIDER_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
      APPLE_TOKEN_ENCRYPTION_KEYS: ${APPLE_TOKEN_ENCRYPTION_KEYS}
      APPLE_TOKEN_KEY_VERSION: ${APPLE_TOKEN_KEY_VERSION}
      SESSION_TOKEN_SECRET: ${HOOKAHBOSS_SESSION_TOKEN_SECRET}
      ADMIN_APPLE_SUBJECTS: ${ADMIN_APPLE_SUBJECTS:-}
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
