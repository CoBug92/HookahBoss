name: HookahBoss
options:
  bundleIdPrefix: ru.kostyuchenko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6.2 currently crashes while batch-compiling this target on Xcode 26.2.
    # Single-file incremental compilation remains enabled and is deterministic.
    SWIFT_ENABLE_BATCH_MODE: NO
    DEVELOPMENT_TEAM: ""
targets:
  HookahBoss:
    type: application
    platform: iOS
    sources:
      - path: HookahBoss
        excludes:
          - App/Configuration/Info.plist
          - App/Configuration/HookahBoss.entitlements
    preBuildScripts:
      - name: SwiftGen
        inputFiles:
          - $(SRCROOT)/swiftgen.yml
          - $(SRCROOT)/HookahBoss/Resources/Localization/en.lproj/Localizable.strings
          - $(SRCROOT)/HookahBoss/Resources/Artwork
        outputFiles:
          - $(SRCROOT)/HookahBoss/Generated/Strings+Generated.swift
          - $(SRCROOT)/HookahBoss/Generated/AssetFiles+Generated.swift
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v swiftgen >/dev/null 2>&1; then
            echo "error: SwiftGen is required. Run 'make bootstrap' from the repository root."
            exit 1
          fi
          mkdir -p "$SRCROOT/HookahBoss/Generated"
          swiftgen config run --config "$SRCROOT/swiftgen.yml"
          perl -pi -e 's/[ \t]+$//' "$SRCROOT"/HookahBoss/Generated/*.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.mixing
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HookahBoss/App/Configuration/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HookahBoss/App/Configuration/HookahBoss.entitlements
      configs:
        Debug:
          # Temporary HTTPS device-test endpoint; replace when the tunnel changes.
          API_BASE_URL: https://effective-reverse-plasma-brain.trycloudflare.com
        Release:
          API_BASE_URL: $(HOOKAHBOSS_RELEASE_API_BASE_URL)
    scheme:
      testTargets:
        - HookahBossTests
        - HookahBossUITests
  HookahBossTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HookahBossTests
    dependencies:
      - target: HookahBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.mixing.tests
        GENERATE_INFOPLIST_FILE: YES
  HookahBossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HookahBossUITests
    dependencies:
      - target: HookahBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.mixing.uitests
        GENERATE_INFOPLIST_FILE: YES
