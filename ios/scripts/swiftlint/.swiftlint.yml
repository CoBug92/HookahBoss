excluded:
  - ../../HookahBoss/Resources/Generated

only_rules:
  - closing_brace
  - closure_parameter_position
  - closure_spacing
  - colon
  - comma
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - control_statement
  - custom_rules
  - duplicate_imports
  - empty_count
  - empty_enum_arguments
  - empty_parameters
  - empty_parentheses_with_trailing_closure
  - explicit_init
  - fatal_error_message
  - file_length
  - first_where
  - force_cast
  - force_try
  - force_unwrapping
  - function_name_whitespace
  - identical_operands
  - implicit_getter
  - leading_whitespace
  - legacy_constant
  - legacy_constructor
  - line_length
  - mark
  - multiline_arguments_brackets
  - no_space_in_method_call
  - opening_brace
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_string_enum_value
  - redundant_void_return
  - return_arrow_whitespace
  - shorthand_operator
  - sorted_imports
  - statement_position
  - syntactic_sugar
  - todo
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - type_name
  - unused_closure_parameter
  - unused_enumerated
  - unused_import
  - unused_optional_binding
  - vertical_whitespace
  - vertical_whitespace_closing_braces
  - void_return

file_length:
  error: 400

line_length:
  warning: 140
  error: 150
  ignores_comments: true
  ignores_interpolated_strings: true
  ignores_multiline_strings: true
  ignores_urls: true

type_name:
  min_length:
    warning: 0
    error: 0
  max_length:
    warning: 60
    error: 70

custom_rules:
  blank_line_after_mark_rule:
    name: Blank line after MARK
    regex: '// MARK: -[^\n]*\n[ \t]*\S'
    message: Add one blank line after MARK sections.
    severity: error

reporter: xcode
