name: HookahBoss

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: ru.kostyuchenko
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_ENABLE_BATCH_MODE: NO
    DEVELOPMENT_TEAM: "${TEAM_ID}"

targets:
  HookahBoss:
    type: application
    platform: iOS
    sources:
      - path: ../../HookahBoss
        excludes:
          - Resources/Plists/Info.plist
          - Resources/Plists/HookahBoss.entitlements
    preBuildScripts:
      - name: SwiftGen
        inputFiles:
          - $(SRCROOT)/scripts/swiftgen/swiftgen.yml
          - $(SRCROOT)/HookahBoss/Resources/Localization/en.lproj/Localizable.strings
        outputFiles:
          - $(SRCROOT)/HookahBoss/Resources/Generated/Strings+Generated.swift
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          "$SRCROOT/scripts/swiftgen/run"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.mixery
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HookahBoss/Resources/Plists/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HookahBoss/Resources/Plists/HookahBoss.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          API_BASE_URL: https://effective-reverse-plasma-brain.trycloudflare.com
        Release:
          API_BASE_URL: $(HOOKAHBOSS_RELEASE_API_BASE_URL)
