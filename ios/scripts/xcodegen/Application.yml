name: HookahBoss

options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: ru.kostyuchenko
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_ENABLE_BATCH_MODE: NO
    DEVELOPMENT_TEAM: ""

targets:
  HookahBoss:
    type: application
    platform: iOS
    sources:
      - path: ../../HookahBoss
        excludes:
          - App/Configuration/Info.plist
          - App/Configuration/HookahBoss.entitlements
    preBuildScripts:
      - name: SwiftGen
        inputFiles:
          - $(SRCROOT)/scripts/swiftgen/swiftgen.yml
          - $(SRCROOT)/HookahBoss/Resources/Localization/en.lproj/Localizable.strings
          - $(SRCROOT)/HookahBoss/Resources/Artwork
        outputFiles:
          - $(SRCROOT)/HookahBoss/Generated/Strings+Generated.swift
          - $(SRCROOT)/HookahBoss/Generated/AssetFiles+Generated.swift
        script: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          "$SRCROOT/scripts/swiftgen/run"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.mixery
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HookahBoss/App/Configuration/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HookahBoss/App/Configuration/HookahBoss.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Debug:
          API_BASE_URL: https://effective-reverse-plasma-brain.trycloudflare.com
        Release:
          API_BASE_URL: $(HOOKAHBOSS_RELEASE_API_BASE_URL)
    scheme:
      testTargets:
        - HookahBossTests
        - HookahBossUITests

  HookahBossTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../../HookahBossTests
    dependencies:
      - target: HookahBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.mixery.tests
        GENERATE_INFOPLIST_FILE: YES

  HookahBossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../../HookahBossUITests
    dependencies:
      - target: HookahBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.kostyuchenko.mixery.uitests
        GENERATE_INFOPLIST_FILE: YES
