strings:
  inputs:
    - HookahBoss/Resources/Localization/en.lproj/Localizable.strings
  outputs:
    - templateName: structured-swift5
      output: HookahBoss/Generated/Strings+Generated.swift
      params:
        enumName: L10n
        publicAccess: true

files:
  inputs:
    - HookahBoss/Resources/Artwork
  filter: .+\.png$
  outputs:
    - templateName: structured-swift5
      output: HookahBoss/Generated/AssetFiles+Generated.swift
      params:
        enumName: AssetFiles
