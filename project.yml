name: HookahBoss
options:
  bundleIdPrefix: com.hookahboss
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  HookahBoss:
    type: application
    platform: iOS
    sources:
      - path: HookahBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hookahboss.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HookahBoss/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: HookahBoss/HookahBoss.entitlements
      configs:
        Debug:
          API_BASE_URL: http://127.0.0.1:3010
        Release:
          API_BASE_URL: $(HOOKAHBOSS_RELEASE_API_BASE_URL)
    scheme:
      testTargets:
        - HookahBossTests
        - HookahBossUITests
  HookahBossTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HookahBossTests
    dependencies:
      - target: HookahBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hookahboss.tests
        GENERATE_INFOPLIST_FILE: YES
  HookahBossUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HookahBossUITests
    dependencies:
      - target: HookahBoss
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hookahboss.uitests
        GENERATE_INFOPLIST_FILE: YES
